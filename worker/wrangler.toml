# StackGrade API on Cloudflare Workers (FREE plan only). No secrets here.
# Secrets are set with `wrangler secret put ADMIN_KEY` / `INTERNAL_KEY` and never committed.
# The account is selected by CLOUDFLARE_API_TOKEN (+ optional CLOUDFLARE_ACCOUNT_ID) in the environment.
name = "api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_als"]
workers_dev = true
preview_urls = false

kv_namespaces = [{ binding = "KV", id = "5695a5e44f72471eb4f7a21f3a3f4301" }]

# The cron fans out one monitor check per invocation through this self-binding, so each check gets its own
# 50-subrequest / 10 ms CPU budget on the free plan.
services = [{ binding = "SELF", service = "api" }]

[triggers]
crons = ["*/5 * * * *"]

[vars]
PRODUCT_AGENCY_KIT = "nexe9SLeFPs0uJlyO6EYkw=="
PRODUCT_PRO = "yQKekf6hTcpoK_7Xp83jPg=="
PRODUCT_AGENCY = "SDoHJkCBWhp7MOLhe3RhXQ=="
PRODUCT_AGENCY_PLUS = "O0PyQiJuzM8-c9NCThQKzQ=="
# Not a StackGrade plan (never unlocks anything here); only used to label Ciphire Pro sales in the admin sales log.
PRODUCT_CIPHIRE_PRO = "rlbL5LDgB6P7GJLCuC65NQ=="
# Sale/refund notifications (worker/src/salenotify.js); secret RESEND_API_KEY is set by the deploy workflow.
SALE_NOTIFY_FROM = "FortHire sales <alerts@forthire.com>"
SALE_NOTIFY_TO = "productbuilder+sale@mail.grokbot.com"
# Stripe fulfillment (worker/src/stripe.js). Secret STRIPE_WEBHOOK_SECRET is set by the deploy workflow from the GitHub
# secret SG_STRIPE_WEBHOOK_SECRET (live endpoint). PLACEHOLDERS: empty sender = no buyer email (thanks page still shows the key).
GT_EMAIL_FROM = ""        # PLACEHOLDER: e.g. "GreenTools <keys@your-verified-resend-domain>"
SG_EMAIL_FROM = ""        # PLACEHOLDER: e.g. "StackGrade <keys@your-verified-resend-domain>"
STRIPE_PORTAL_URL = "https://billing.stripe.com/p/login/00w14p9ah5hl2yi3YeaR200"   # live portal login (config bpc_1USBf6QZcBGAqLabKkKuGLMR)

[observability]
enabled = true

# ---- Staging: `wrangler deploy --env staging` -> api-staging.<sub>.workers.dev. Own KV, no cron, no secrets needed for
# /v1/unlock tests. Smoke: node tools/unlock-smoke.mjs <base>. ----
[env.staging]
name = "api-staging"
workers_dev = true
preview_urls = false
kv_namespaces = [{ binding = "KV", id = "994f92e27dbf4e61b839f7bc2452c09e" }]   # STACKGRADE_STAGING
services = [{ binding = "SELF", service = "api-staging" }]

[env.staging.triggers]
crons = []

[env.staging.vars]
SALE_NOTIFY_FROM = "FortHire sales <alerts@forthire.com>"
SALE_NOTIFY_TO = "productbuilder+sale@mail.grokbot.com"
PRODUCT_AGENCY_KIT = "nexe9SLeFPs0uJlyO6EYkw=="
PRODUCT_PRO = "yQKekf6hTcpoK_7Xp83jPg=="
PRODUCT_AGENCY = "SDoHJkCBWhp7MOLhe3RhXQ=="
PRODUCT_AGENCY_PLUS = "O0PyQiJuzM8-c9NCThQKzQ=="
# Stripe sandbox (secret STRIPE_WEBHOOK_SECRET from GitHub secret STAGING_SG_STRIPE_WEBHOOK_SECRET)
GT_EMAIL_FROM = ""        # PLACEHOLDER (staging sender)
SG_EMAIL_FROM = ""        # PLACEHOLDER (staging sender)
STRIPE_PORTAL_URL = "https://billing.stripe.com/p/login/test_9B628rfPN0et6zK12M3sI00"   # sandbox portal login (config bpc_1USBewHIF61kB5K4Yp1gR7fK)
