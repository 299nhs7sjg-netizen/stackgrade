# Daily badge re-grade. NOT ACTIVE: to enable, move this file to .github/workflows/badges.yml.
# (The bot's token lacks the GitHub "workflow" scope, so it cannot push files under .github/workflows/.)
name: Re-grade badges
on:
  schedule:
    - cron: '17 9 * * *'   # daily 09:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: badges
  cancel-in-progress: false
jobs:
  regrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node tools/badges.mjs
      - name: Commit badges
        run: |
          git config user.name "stackgrade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badge/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Daily badge re-grade $(date -u +%F)"
          git push
      - name: Request a Pages build (GITHUB_TOKEN pushes may not trigger one)
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
